<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImageGuard</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2430; --muted:#667085; --line:#e4e7ec;
            --ok:#0e7a3e; --okbg:#e7f6ee; --bad:#b42318; --badbg:#fdecea; --wait:#8a5a00; --waitbg:#fff4dc; --brand:#2454d6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
    header h1 { font-size:20px; margin:0; }
    main { max-width:960px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
    button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
    button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .muted { color:var(--muted); font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:16px; }
    .item { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
    .thumb { height:150px; background:#eef0f3; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; text-align:center; padding:8px; }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .meta { padding:10px 12px; font-size:13px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
    .APPROVED { color:var(--ok); background:var(--okbg); }
    .REJECTED { color:var(--bad); background:var(--badbg); }
    .PENDING  { color:var(--wait); background:var(--waitbg); }
    .tags { margin-top:6px; color:var(--muted); }
    #message { min-height:20px; margin-top:10px; font-size:14px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>ImageGuard</h1>
    <div>
      <span id="user" class="muted"></span>
      <button id="loginBtn" class="primary">Đăng nhập</button>
      <button id="logoutBtn" class="hidden">Đăng xuất</button>
    </div>
  </header>

  <main>
    <section id="guest" class="card">
      <h2>Kiểm duyệt ảnh tự động</h2>
      <p class="muted">Đăng nhập để tải ảnh lên. Ảnh được Amazon Rekognition kiểm duyệt rồi gắn nhãn tự động.</p>
    </section>

    <section id="app" class="hidden">
      <div class="card">
        <h2>Tải ảnh lên</h2>
        <input type="file" id="fileInput" accept="image/jpeg">
        <button id="uploadBtn" class="primary">Tải lên</button>
        <p class="muted">Chỉ nhận ảnh JPEG, tối đa 5 MB.</p>
        <div id="message"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2>Ảnh của tôi</h2>
          <button id="refreshBtn">Làm mới</button>
        </div>
        <div id="gallery" class="grid"></div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
